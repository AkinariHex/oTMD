<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osu! Tourney Match Displayer | Ranked overview</title>
    <link rel="stylesheet" href="/ranked.css" />
  </head>
  <body>
    <main id="ratio" class="frame" hidden>
      <div class="ratio-user">
        <img class="ratio-avatar" id="avatar" alt="" />
        <div class="ratio-identity">
          <div class="ratio-name" id="username"></div>
          <div class="ratio-rank" id="rank"></div>
        </div>
        <span class="ratio-change" id="change"></span>
      </div>
      <div class="ratio-tiles">
        <section class="ratio-tile">
          <span class="ratio-label">This match</span>
          <div class="ratio-value"><span class="wins" id="wins"></span><span class="ratio-separator">-</span><span class="losses" id="losses"></span></div>
          <span class="ratio-caption">maps won - lost</span>
          <div class="ratio-recent" id="recent"></div>
        </section>
        <section class="ratio-tile" id="season">
          <span class="ratio-label">Season</span>
          <div class="ratio-value" id="seasonPercent"></div>
          <span class="ratio-caption" id="seasonRecord"></span>
          <div class="ratio-season-bar"><div class="ratio-season-fill" id="seasonFill"></div></div>
        </section>
      </div>
    </main>
    <script src="/common.js"></script>
    <script src="/ranked-ratio.js"></script>
  </body>
</html>
