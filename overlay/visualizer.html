<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osu! Tourney Match Displayer | Visualizer</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/odometer/odometer-theme-minimal.css" />
  </head>
  <body>
    <main id="panel" class="panel aurora">
      <div class="amb" id="amb" aria-hidden="true"></div>
      <div class="content">
        <div class="meta top" id="metaTop"></div>
        <div class="mid">
          <div class="message" id="message">Waiting an Account</div>
          <div class="match" id="match" hidden></div>
          <div class="qualifiers" id="qualifiers" hidden></div>
        </div>
        <div class="meta bottom" id="metaBottom"></div>
      </div>
    </main>

    <script src="/data.js"></script>
    <script src="/odometer/odometer.min.js"></script>
  </body>
</html>
