[package]
name = "otmd"
version = "2.0.0"
description = "Displayer for osu! Tournament Matches"
authors = ["Akinari"]
license = "GPL-3.0"
repository = "https://github.com/AkinariHex/oTMD"
edition = "2024"
rust-version = "1.90"

[lib]
name = "otmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
