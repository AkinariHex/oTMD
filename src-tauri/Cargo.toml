[package]
name = "otmd"
version = "2.0.0"
description = "Displayer for osu! Tournament Matches"
authors = ["Akinari"]
license = "GPL-3.0"
repository = "https://github.com/AkinariHex/oTMD"
edition = "2024"
rust-version = "1.90"

[lib]
name = "otmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
